on:
  workflow_dispatch:
  schedule:
  - cron: "0 20 * * *"

jobs:
  run_forecast:
    runs-on: ubuntu-latest
    container:
      image: eco4cast/rocker-neon4cast
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install R packages
        run: Rscript -e 'install.packages("tidymodels","doParallel","ranger","readr","httr","jsonlite" repos = "https://cloud.r-project.org")'
          
 # Point to the right path, run the right Rscript command
      - name: Run automatic forecast submission
        run: Rscript Submit_forecast/Forecast.R
        
